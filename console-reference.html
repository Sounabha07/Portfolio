function stars(n){let s='';for(let i=0;i<n;i++)s+='<span class="star" style="left:'+((i*47)%300+8)+'px;top:'+((i*71)%260+10)+'px;animation-delay:'+((i*.37)%2).toFixed(2)+'s"></span>';return s}
function confetti(){let s='';for(let i=0;i<16;i++)s+='<span class="cf" style="left:'+((i*41)%300+6)+'px;background:var(--s'+(i%2?2:3)+');animation-duration:'+(3+(i%4)*.6)+'s;animation-delay:'+((i*.31)%3).toFixed(2)+'s"></span>';return s}
function render(){clearInterval(tw);const s=S.scr;
if(s==='boot'){view.innerHTML=stars(14)+'<div class="boot"><div class="shn"><div class="logo">Sounabha</div></div><div class="sub">Portfolio system</div><div class="ldb"><i></i></div><div class="ps" id="ps" style="visibility:hidden">Press start</div></div>';setTimeout(()=>{S.ready=true;const p=$('#ps');if(p)p.style.visibility='visible'},RM?0:2500);return}

if(s==='projects'){view.innerHTML='<div class="hd"><span>Projects</span><span>'+(S.p+1)+'/'+PR.length+'</span></div><div class="bd">'+PR.map((p,i)=>'<div class="row'+(i===S.p?' sel':'')+'" style="padding:6px 0"><span class="cur"></span>'+spr(p.i,24)+'<span>'+p.n+'</span><span style="margin-left:auto">'+p.s+'</span></div>').join('')+'</div>'+ft('A open','B back');return}
if(s==='project'){const p=PR[S.p];view.innerHTML='<div class="hd"><span>&lt; '+p.n+' &gt;</span><span>'+(p.s||'Done')+'</span></div><div class="bd" style="padding-top:2px">'+scene(p.sc)+'<div>'+p.d+'</div><div style="margin-top:6px;color:var(--s2)">'+p.t+'</div></div>'+ft(PR[S.p].u?'A code':'Code soon','B back');return}
if(s==='cp'){view.innerHTML=confetti()+'<div class="hd"><span>Achievements</span><span>2026</span></div><div class="scr" id="scr"><div style="display:flex;justify-content:center;margin:0 0 10px"><div class="shn" style="padding:0">'+spr('trophy',44)+'</div></div>'+ACH.map(a=>'<div class="ai"><div>'+a[0]+'</div><div>'+a[1]+'</div></div>').join('')+'</div>'+ft('','B back');const el=$('#scr');if(el.scrollHeight>el.clientHeight)view.querySelector('.ft span').textContent='Up/Dn scroll';return}
if(s==='contact'){const c=CT[S.c];view.innerHTML='<div class="hd"><span>Contact</span><span>'+(S.c+1)+'/'+CT.length+'</span></div><div class="bd"><div style="display:flex;gap:12px;align-items:flex-start">'+spr('mail',48,'flt')+'<div style="flex:1">'+CT.map((x,i)=>'<div class="row'+(i===S.c?' sel':'')+'"><span class="cur"></span><span>'+x[0]+'</span></div>').join('')+'</div></div><div style="margin-top:14px;border-top:2px solid var(--s1);padding-top:8px;text-transform:none">'+c[1]+'</div></div>'+ft('A open','B back')}}
function type(){clearInterval(tw);S.ch=0;const t=AB[S.pg],el=$('#tw'),nx=$('#nx');if(RM){el.textContent=t;S.ch=t.length;nx.style.visibility='visible';return}tw=setInterval(()=>{S.ch++;el.textContent=t.slice(0,S.ch);if(S.ch%2===0)blip();if(S.ch>=t.length){clearInterval(tw);nx.style.visibility='visible'}},32)}
function go(s){if(RM){S.scr=s;render();return}S.busy=true;wp.classList.remove('on');void wp.offsetWidth;wp.classList.add('on');setTimeout(()=>{S.scr=s;render()},200);setTimeout(()=>{S.busy=false},440)}
function press(k){burst(k);flash(k);
if(k==='select'){S.dark=!S.dark;applyPal();beep(660,.06);toast(S.dark?'Lights off':'Lights on');return}
if(S.busy)return;
if(S.scr==='boot'){if(S.ready&&(k==='start'||k==='a')){beep(1046,.09);beep(1568,.22,.1);$('#led').classList.add('on');go('menu')}return}
if(k==='start'){beep(880,.05);go('menu');return}
const s=S.scr;
if(s==='menu'){if(k==='up'){S.m=(S.m+MENU.length-1)%MENU.length;beep(700,.03);render()}else if(k==='down'){S.m=(S.m+1)%MENU.length;beep(700,.03);render()}else if(k==='a'){beep(990,.06);S.pg=0;go(MENU[S.m][2])}return}
if(k==='b'){beep(440,.05);go(s==='project'?'projects':'menu');return}
if(s==='about'&&k==='a'){const t=AB[S.pg];if(S.ch<t.length){clearInterval(tw);S.ch=t.length;$('#tw').textContent=t;$('#nx').style.visibility='visible'}else{beep(990,.04);if(S.pg<AB.length-1){S.pg++;render()}else go('menu')}return}
if(s==='projects'){if(k==='up'){S.p=(S.p+PR.length-1)%PR.length;beep(700,.03);render()}else if(k==='down'){S.p=(S.p+1)%PR.length;beep(700,.03);render()}else if(k==='a'){beep(990,.06);go('project')}return}
if(s==='project'){if(k==='left'){S.p=(S.p+PR.length-1)%PR.length;beep(700,.03);go('project')}else if(k==='right'){S.p=(S.p+1)%PR.length;beep(700,.03);go('project')}else if(k==='a'){if(PR[S.p].u){beep(990,.06);openL(PR[S.p].u)}else{beep(300,.12);toast('Code coming soon')}}return}
if(s==='cp'){const el=$('#scr');if(el&&(k==='up'||k==='down')){const b=el.scrollTop;el.scrollTop+=(k==='down'?36:-36);if(el.scrollTop!==b)beep(700,.03)}return}
if(s==='contact'){if(k==='up'){S.c=(S.c+CT.length-1)%CT.length;beep(700,.03);render()}else if(k==='down'){S.c=(S.c+1)%CT.length;beep(700,.03);render()}else if(k==='a'){const c=CT[S.c];if(c[2]){beep(990,.06);openL(c[2])}else{beep(300,.12);toast('Coming soon')}}}}
document.querySelectorAll('.gb button').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('pr');press(b.dataset.k)});['pointerup','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>b.classList.remove('pr')));b.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();b.classList.add('pr');press(b.dataset.k);setTimeout(()=>b.classList.remove('pr'),120)}})});
const KM={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',z:'a',j:'a',' ':'a',x:'b',k:'b',Backspace:'b',Enter:'start',Shift:'select'};
function flash(k){const n=['up','down','left','right'].includes(k)?'move':k,el=document.querySelector('.kg[data-g="'+n+'"]');if(!el)return;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),160)}
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=KM[e.key.length===1?e.key.toLowerCase():e.key];if(!k)return;e.preventDefault();const b=document.querySelector('.gb button[data-k="'+k+'"]');if(b){b.classList.add('pr');setTimeout(()=>b.classList.remove('pr'),120)}press(k)});
const STG=document.getElementById('stage'),bg=document.getElementById('bg'),g=bg.getContext('2d'),fx=document.getElementById('fx'),f2=fx.getContext('2d');let BW=0,BH=0;
function bgSize(){const d=Math.min(window.devicePixelRatio||1,2);BW=STG.clientWidth;BH=STG.clientHeight;[bg,fx].forEach(c=>{c.width=BW*d;c.height=BH*d;c.style.width=BW+'px';c.style.height=BH+'px'});g.setTransform(d,0,0,d,0,0);f2.setTransform(d,0,0,d,0,0)}
const FK=['rack','graph','flow','trophy','mail','person','rack','flow'];
const FL=Array.from({length:16},(_,i)=>({k:FK[i%FK.length],x:Math.random(),y:Math.random(),s:2+(i%3),v:8+Math.random()*12,ph:Math.random()*6.28,c:i%5===0}));
const PT=[];
function burst(k){const q={a:'[data-k="a"]',b:'[data-k="b"]',start:'[data-k="start"]',select:'[data-k="select"]'}[k]||'.dp';const el=document.querySelector('.gb '+q);if(!el)return;const r=el.getBoundingClientRect(),sr=STG.getBoundingClientRect();const cx=r.left+r.width/2-sr.left,cy=r.top+r.height/2-sr.top;for(let i=0;i<16;i++){const a=Math.random()*6.283,sp=70+Math.random()*160;PT.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,s:3+Math.floor(Math.random()*3),c:Math.random()<.7?'#e8644a':'#efe9df'})}if(RM)bgFrame(performance.now())}
function drawSpr(k,x,y,s,col){const m=SP[k];g.fillStyle=col;for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++){const ch=m[r][c];if(ch!=='.'&&ch!=='3')g.fillRect(Math.round(x+c*s),Math.round(y+r*s),s,s)}}
let bl=performance.now();
function bgFrame(now){const dt=Math.min(.05,(now-bl)/1000);bl=now;const t=now/1000;g.clearRect(0,0,BW,BH);
const cr=gb.getBoundingClientRect(),sr=STG.getBoundingClientRect(),gx=cr.left+cr.width/2-sr.left,gy=cr.top+cr.height*.36-sr.top;const rg=g.createRadialGradient(gx,gy,10,gx,gy,360);rg.addColorStop(0,'rgba(232,100,74,'+(.14+.05*Math.sin(t*1.2)).toFixed(3)+')');rg.addColorStop(1,'rgba(232,100,74,0)');g.fillStyle=rg;g.fillRect(0,0,BW,BH);
for(let y=12;y<BH;y+=24)for(let x=12;x<BW;x+=24){const v=Math.sin((x*.6+y)/110-t*1.4);if(v>.8){g.fillStyle='rgba(232,100,74,'+((v-.8)*2.4).toFixed(3)+')';g.fillRect(x-1,y-1,3,3)}else{g.fillStyle='#2a2c33';g.fillRect(x,y,2,2)}}
FL.forEach(f=>{f.y-=f.v*dt/Math.max(BH,1);if(f.y<-.08){f.y=1.04;f.x=Math.random()}drawSpr(f.k,f.x*BW+Math.sin(t*.5+f.ph)*12,f.y*BH,f.s,f.c?'rgba(232,100,74,.32)':'rgba(141,145,156,.2)')});
f2.clearRect(0,0,BW,BH);for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.life-=dt*1.3;if(p.life<=0){PT.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.95;p.vy*=.95;f2.globalAlpha=Math.max(0,p.life);f2.fillStyle=p.c;f2.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s)}f2.globalAlpha=1}
function bgLoop(now){bgFrame(now);requestAnimationFrame(bgLoop)}
bgSize();if(window.ResizeObserver)new ResizeObserver(bgSize).observe(STG);else addEventListener('resize',bgSize);
if(RM)bgFrame(performance.now());else requestAnimationFrame(bgLoop);
